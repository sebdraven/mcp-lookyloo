name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the release once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi

  binaries:
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          bin="mcp-lookyloo-${suffix}${EXT}"
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" -o "$bin" ./cmd/mcp-lookyloo
          sha256sum "$bin" > "checksums-${suffix}.txt"
          grep -Eq '^[0-9a-f]{64}  ' "checksums-${suffix}.txt"
          cat "checksums-${suffix}.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: the linux/amd64 binary reports the tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          TAG: ${{ github.ref_name }}
        run: test "$(./mcp-lookyloo-linux-amd64 -version)" = "$TAG"

      - name: publish the binary and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "mcp-lookyloo-${suffix}${EXT}" "checksums-${suffix}.txt"
